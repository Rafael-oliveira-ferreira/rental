name: Python CI - pricing-service

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pricing-service
  PYTHON_VERSION: '3.12'

defaults:
  run:
    working-directory: apps/pricing-service

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/pricing-service/requirements.txt
            apps/pricing-service/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest --junitxml=build/test-results/pytest.xml

      - name: Upload Pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: apps/pricing-service/build/test-results/
          retention-days: 7
          if-no-files-found: warn

  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/pricing-service/requirements.txt
            apps/pricing-service/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: |
          mkdir -p build/reports/ruff
          python -m ruff check app tests --output-format=github
          python -m ruff check app tests --output-format=junit \
            --output-file=build/reports/ruff/ruff.xml --exit-zero

      - name: Ruff format
        run: python -m ruff format --check --diff app tests

      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-ruff-reports
          path: apps/pricing-service/build/reports/ruff/
          retention-days: 7
          if-no-files-found: warn

  image:
    name: Python Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [tests, quality]
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (push only from main)
        uses: docker/build-push-action@v6
        with:
          context: apps/pricing-service
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pricing-service
          cache-to: type=gha,mode=max,scope=pricing-service
